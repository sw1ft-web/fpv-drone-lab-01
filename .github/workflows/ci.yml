name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Typecheck (strict, every package)
        run: npm run typecheck
      - name: Lint (type-checked ESLint)
        run: npm run lint
      - name: Format
        run: npm run format:check
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
