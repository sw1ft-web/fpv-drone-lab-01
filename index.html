<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FPV Drone — Lab 02</title>
  </head>
  <body>
    <main id="game">
      <canvas id="gameCanvas" aria-label="FPV drone arena"></canvas>

      <section class="hud">
        <h1>FPV DRONE — LAB 02</h1>
        <div class="stats">
          <span>HP: <b id="hp">100/100</b></span>
          <span>Score: <b id="score">0</b></span>
          <span>Entities: <b id="entities">0</b></span>
          <span>Steps/s: <b id="steps">0</b></span>
          <span>Frames/s: <b id="frames">0</b></span>
          <span>Frame: <b id="frameTime">0.00</b> ms</span>
        </div>
        <div class="controls">
          <span><b>W / ↑</b> — thrust</span>
          <span><b>A / D</b> — rotate</span>
          <span><b>F</b> — fire</span>
          <span><b>Space</b> — fire/cooldown action</span>
          <span><b>0–3</b> — experiments</span>
        </div>
        <div id="experiment" class="experiment"></div>
      </section>

      <div class="crosshair"></div>
      <div class="vignette"></div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
